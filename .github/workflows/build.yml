name: Build LZDoom AppImage
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ make cmake libsdl2-dev git zlib1g-dev \
            libbz2-dev libjpeg-dev libfluidsynth-dev libgme-dev libopenal-dev \
            libmpg123-dev libsndfile1-dev libwildmidi-dev libgtk-3-dev \
            timidity nasm tar chrpath libvpx-dev libwebp-dev

      - name: Clone and build ZMusic
        run: |
          git clone https://github.com/ZDoom/ZMusic.git
          mkdir ZMusic/build && cd ZMusic/build
          cmake -DCMAKE_BUILD_TYPE=Release ..
          cmake --build . -j$(nproc)
          sudo make install
          sudo ldconfig

      - name: Checkout LZDoom
        uses: actions/checkout@v4
        with:
          repository: drfrag666/lzdoom
          submodules: recursive

      - name: Build LZDoom
        run: |
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          make -j$(nproc)

      - name: Download linuxdeploy
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage

      - name: Package as AppImage
        run: |
          mkdir -p AppDir/usr/bin
          cp build/lzdoom AppDir/usr/bin/
          cp build/*.pk3 AppDir/usr/bin/ || true
          cat > AppDir/lzdoom.desktop << 'EOF'
          [Desktop Entry]
          Type=Application
          Name=LZDoom
          Exec=lzdoom
          Icon=lzdoom
          Categories=Game;
          EOF
          # Generar un ícono PNG válido (cuadrado sólido simple, 256x256)
          convert -size 256x256 xc:"#8B0000" AppDir/lzdoom.png
          ./linuxdeploy-x86_64.AppImage --appdir AppDir \
            --executable AppDir/usr/bin/lzdoom \
            --desktop-file AppDir/lzdoom.desktop \
            --icon-file AppDir/lzdoom.png \
            --output appimage

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: lzdoom-appimage
          path: "*.AppImage"

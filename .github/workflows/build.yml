name: Build LZDoom (Arch container)
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:latest

    steps:
      - name: Update system and install dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed \
            base-devel cmake git \
            sdl2 zlib bzip2 libjpeg-turbo \
            fluidsynth game-music-emu openal \
            libsndfile wildmidi gtk3 \
            nasm libvpx libwebp \
            mesa

      - name: Clone and build ZMusic
        run: |
          git clone https://github.com/ZDoom/ZMusic.git
          mkdir ZMusic/build && cd ZMusic/build
          cmake -DCMAKE_BUILD_TYPE=Release ..
          cmake --build . -j$(nproc)
          make install
          ldconfig

      - name: Checkout LZDoom
        uses: actions/checkout@v4
        with:
          repository: drfrag666/lzdoom
          submodules: recursive

      - name: Build LZDoom
        run: |
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          make -j$(nproc)

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: lzdoom-arch
          path: build/lzdoom
